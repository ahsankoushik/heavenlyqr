services:
  postgres:
    image: postgres:17-alpine
    container_name: heavenlyqr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: heavenlyqr-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: applies Prisma migrations, then exits. api/worker wait for it
  # to finish successfully before starting.
  migrate:
    build:
      context: ./backend
    image: heavenlyqr-backend:latest
    container_name: heavenlyqr-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    image: heavenlyqr-backend:latest
    container_name: heavenlyqr-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      QR_JOB_QUEUE_NAME: qr-generation
      STORAGE_DIR: /app/storage
    ports:
      - "4000:4000"
    volumes:
      - qr_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
    image: heavenlyqr-backend:latest
    container_name: heavenlyqr-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      QR_JOB_QUEUE_NAME: qr-generation
      STORAGE_DIR: /app/storage
    volumes:
      - qr_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    image: heavenlyqr-frontend:latest
    container_name: heavenlyqr-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      # Server-side (SSR/actions) traffic — internal Docker DNS name, not the
      # browser-facing PUBLIC_API_URL. See hooks.server.ts.
      API_INTERNAL_URL: http://api:4000
    ports:
      - "5173:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  qr_storage:
